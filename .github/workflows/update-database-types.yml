name: Update database types 

on:
  push:
    branches:
      - develop
    paths:
      - 'supabase/migrations/*.sql'

jobs:
  deploy-and-gen-types:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Generate types from development 
        run: |
          supabase gen types typescript --project-id ${{ secrets.DEVELOPMENT_PROJECT_ID }} > database.types.ts

      - name: Commit updated types
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: sync types with database schema"
          file_pattern: database.types.ts 
